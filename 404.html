  <title>Digital Pigeon</title>

<body>
  <p>Opening Digital Pigeon…</p>
  <script>
    (function () {
      var path = location.pathname;
      var parts = path.split('/').filter(Boolean);
      var base = parts.length ? '/' + parts[0] + '/' : '/';
      location.replace(base);
    })();
  </script>
</body>
