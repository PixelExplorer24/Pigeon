<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><meta name="application-version" content="fast-messenger-v1">
<title>Fast Messenger</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="./assets/css/app.css?v=1">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="loginScreen" class="login-screen hidden">
  <div class="login-card"><div class="brand-mark"><i class="fa-solid fa-paper-plane"></i></div><h1>Fast Messenger</h1><p>দ্রুত, realtime এবং private messaging.</p><button id="googleLogin" class="google-btn"><i class="fa-brands fa-google"></i> Google দিয়ে শুরু করুন</button><small id="loginError"></small></div>
</div>
<div id="app" class="app hidden">
  <header class="topbar"><div class="topbar-inner"><div class="brand"><div class="brand-icon"><i class="fa-solid fa-paper-plane"></i></div><div><b>Fast Messenger</b><span>Realtime private chat</span></div></div><div class="top-actions"><button id="newChatBtn" class="icon-btn" title="নতুন চ্যাট"><i class="fa-solid fa-pen-to-square"></i></button><button id="profileBtn" class="avatar-btn"><img id="headerAvatar" alt="Profile"><span id="headerOnline"></span></button></div></div></header>
  <main class="main">
    <section id="homeView" class="view active">
      <div class="view-head"><div><h2>Chats</h2><p id="chatSummary">আপনার realtime conversations</p></div><button id="refreshBtn" class="soft-btn"><i class="fa-solid fa-arrows-rotate"></i></button></div>
      <div class="search-wrap"><i class="fa-solid fa-magnifying-glass"></i><input id="chatSearch" placeholder="চ্যাট বা মানুষ খুঁজুন..."></div>
      <div id="chatList" class="chat-list"></div>
    </section>
    <section id="peopleView" class="view">
      <div class="view-head"><div><h2>People</h2><p>বন্ধু খুঁজুন ও conversation শুরু করুন</p></div></div>
      <div class="search-wrap"><i class="fa-solid fa-magnifying-glass"></i><input id="peopleSearch" placeholder="নাম বা email দিয়ে খুঁজুন..."></div>
      <div class="people-tabs"><button class="pill active" data-people-tab="friends">Friends</button><button class="pill" data-people-tab="requests">Requests <span id="requestBadge">0</span></button><button class="pill" data-people-tab="all">Find people</button></div>
      <div id="peopleList" class="people-list"></div>
    </section>
    <section id="profileView" class="view">
      <div class="profile-page"><div class="profile-cover"></div><div class="profile-main"><div class="profile-avatar"><img id="profileAvatar" alt="Profile"></div><h2 id="profileName">User</h2><p id="profileEmail"></p><div class="profile-status"><span class="status-dot"></span> Online</div><div class="profile-stats"><div><b id="statChats">0</b><span>Chats</span></div><div><b id="statFriends">0</b><span>Friends</span></div><div><b id="statSent">0</b><span>Sent</span></div></div><button id="editProfileBtn" class="primary-btn"><i class="fa-solid fa-user-pen"></i> Edit profile</button><button id="logoutBtn" class="danger-btn"><i class="fa-solid fa-right-from-bracket"></i> Log out</button></div></div>
    </section>
  </main>
  <nav class="bottom-nav"><button class="nav-item active" data-view="homeView"><i class="fa-solid fa-comments"></i><span>Chats</span><b id="navChatBadge" class="nav-badge hidden">0</b></button><button class="nav-item" data-view="peopleView"><i class="fa-solid fa-user-group"></i><span>People</span><b id="navPeopleBadge" class="nav-badge hidden">0</b></button><button class="nav-item" data-view="profileView"><i class="fa-solid fa-user"></i><span>Profile</span></button></nav>
</div>
<div id="chatPanel" class="chat-panel hidden">
  <header class="chat-top"><button id="backChat" class="icon-btn"><i class="fa-solid fa-arrow-left"></i></button><img id="chatAvatar" alt=""><div class="chat-title"><b id="chatName">Chat</b><span id="chatStatus">offline</span></div><button id="chatInfo" class="icon-btn"><i class="fa-solid fa-circle-info"></i></button></header>
  <div id="messages" class="messages"></div><div id="typing" class="typing hidden"><span></span><span></span><span></span><em>typing...</em></div>
  <form id="composer" class="composer"><label class="attach"><input id="imageInput" type="file" accept="image/*" multiple hidden><i class="fa-regular fa-image"></i></label><div class="compose-box"><div id="attachmentPreview" class="attachment-preview hidden"></div><textarea id="messageInput" rows="1" maxlength="4000" placeholder="মেসেজ লিখুন..."></textarea></div><button class="send-btn" type="submit"><i class="fa-solid fa-paper-plane"></i></button></form>
</div>
<div id="profileModal" class="modal hidden"><div class="modal-card"><button class="modal-close" data-close="profileModal"><i class="fa-solid fa-xmark"></i></button><h3>Edit profile</h3><label>Name<input id="editName" maxlength="80"></label><label>Photo URL<input id="editPhoto" type="url" placeholder="https://..."></label><label>Bio<textarea id="editBio" maxlength="300" rows="3"></textarea></label><button id="saveProfile" class="primary-btn">Save changes</button></div></div>
<div id="userModal" class="modal hidden"><div class="modal-card user-card"><button class="modal-close" data-close="userModal"><i class="fa-solid fa-xmark"></i></button><img id="userModalAvatar" class="user-modal-avatar" alt=""><h3 id="userModalName"></h3><p id="userModalEmail"></p><p id="userModalBio"></p><button id="userModalChat" class="primary-btn">Open chat</button></div></div>
</div>
<script src="./assets/js/app.js?v=1"></script>
</body></html>
